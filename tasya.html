<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Tasya Fahriatur Rosya ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="card">
            <div class="heart">❤️</div>

            <h1>Hai, Sayang! 💕</h1>

            <img src="foto.jpg" alt="Foto kita" class="foto">

            <h2>Untuk perempuan favoritku 🌷</h2>

            <p class="intro">
                Ada seseorang yang akhir-akhir ini selalu ada di pikiranku...
                dan orang itu adalah kamu. ❤️
            </p>

            <div class="buttons">
                <button onclick="pesan1()">💌 Klik Aku</button>
                <button onclick="pesan2()">🥰 Pesan Rahasia</button>
                <button onclick="pesan3()">❤️ Terakhir</button>
            </div>

            <div id="pesan" class="message">
                Klik salah satu tombol di atas yaa 😚
            </div>

            <p class="footer">
                Dibuat khusus untuk perempuan tersayang ❤️
            </p>
        </div>

    </div>

    <script>
        function pesan1() {
            document.getElementById("pesan").innerHTML =
                "Kamu tahu nggak? kamu itu lucuuu bangettt walaupun pendeq tapi bikin ngangenin 😊❤️";
        }

        function pesan2() {
            document.getElementById("pesan").innerHTML =
                "Aku nggak butuh seseorang yang sempurna. Aku cuma butuh seseorang yang bisa tetap menjadi dirinya sendiri, dan aku senang orang itu adalah kamu. 🥺💕";
        }

        function pesan3() {
            document.getElementById("pesan").innerHTML =
                "Kalau aku boleh memilih lagi, aku tetap akan memilih kamu. Terima kasih sudah hadir dan membuat hidupku lebih berwarna. I Love You Tasya❤️🥰";
        }
    </script>

</body>
</html>
